<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TechLink Rwanda</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style1.css">
    <link rel="stylesheet" href="./style2.css">
</head>

<body>

<header class="site-header">
    <div class="logo">Tech<span>Link</span> Rwanda </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="technicians.html">Find Technician</a>
        <a href="register.html">Register</a>
        <a href="profile.html">Profile</a>
        <a href="about.html">About</a>
         <a href="./login.html">Login</a>
    </nav>
</header>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            <div class="logo-mark">TL</div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your email and we will help you reset your password.
            </p>
        </div>

        <div id="forgotMessage" class="message"></div>

        <!-- Step 1: Request reset -->

        <form id="forgotForm">

            <div class="form-group">
                <label for="forgotEmail">Email Address</label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required>
            </div>

            <button type="submit" class="auth-btn">
                Send Reset Code
            </button>

        </form>

        <!-- Step 2: Reset password -->

        <form id="resetForm" class="reset-form">

            <div class="form-group">
                <label for="resetCode">Reset Code</label>

                <input
                    type="text"
                    id="resetCode"
                    placeholder="Enter the 6-digit code"
                    maxlength="6"
                    inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6">
            </div>

            <button type="submit" class="auth-btn">
                Reset Password
            </button>

        </form>

        <p class="login-link">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

        <p class="back-home">
            <a href="home.html">← Back to TechLink Rwanda</a>
        </p>

    </section>

</main>

<footer>
    <p>© 2026 TechLink Rwanda. All Rights Reserved.</p>
    <p>Find • Connect • Fix</p>
</footer>

<script src="./forgot-password.js"></script>
</body>
</html>
