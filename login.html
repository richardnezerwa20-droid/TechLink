<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechLink Rwanda</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style1.css">
    <link rel="stylesheet" href="./style2.css">
</head>

<body>

<header class="site-header">
    <div class="logo">Tech<span>Link</span> Rwanda </div>

    <nav>
        <!-- <a href="home.html">Home</a>
        <a href="technicians.html">Find Technician</a>
        <a href="register.html">Register</a>
        <a href="profile.html">Profile</a>
        <a href="about.html">About</a> -->
        <a href="./login.html">Login</a>
    </nav>
</header>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            <div class="logo-mark">TL</div>
            <h1>Welcome Back</h1>
            <p>Login to your TechLink Rwanda account</p>
        </div>

        <div id="loginMessage" class="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password">
                        Show
                    </button>
                </div>
            </div>

            <label class="remember">
                <input type="checkbox" id="rememberMe">
                <span>Remember me</span>
            </label>

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register as a Technician</a>
        </p>

        <p class="back-home">
            <a href="home.html">← Back to TechLink Rwanda</a>
        </p>

    </section>

</main>

<footer>
    <p>© 2026 TechLink Rwanda. All Rights Reserved.</p>
    <p>Find • Connect • Fix</p>
</footer>

<script src="./login.js"></script>
</body>
</html>
